name: Calculadora CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout de código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyright

    - name: Ejecutar Análisis Estático (Pyright/Pylance)
      run: npx pyright  # Esto analiza los tipos de tu código

    - name: Ejecutar Pruebas TDD (Unittest)
      run: python test_calculadora.py